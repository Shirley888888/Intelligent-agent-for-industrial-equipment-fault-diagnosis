# ============================================================
# 课程任务：ETTh1 过去 seq_len 小时 -> 未来 pred_len 小时油温(OT) 预测
# 这是每轮超参数调节的唯一入口：修改本文件后运行 `python train.py`
# 注意（修正版）：训练阶段只在 Validation 上评估（val_mae/val_mse），
# 结构/超参据此选择；Test 不参与调参，最终方案确定后由
# `python evaluate.py --model <模型>` 做一次正式评价。
# ============================================================

data:
  seq_len: 96          # 输入窗口：过去 96 小时
  pred_len: 24         # 输出窗口：未来 24 小时
  train_frac: 0.70     # 时间序列划分：训练 70%
  val_frac: 0.15       # 验证 15%（其余为测试 15%）

training:
  epochs: 200           # r7: 100 -> 200（第三次训练超参变化：训练轮数翻倍，观察更长训练能否继续提升 CNN/LSTM）
  batch_size: 128       # r6: 256 -> 128（第二次训练超参变化：batch 减半，梯度更抖，观察收敛与泛化）
  lr: 0.0001           # r5: 0.001 -> 0.0001（第一次训练超参变化：学习率降 10 倍，观察过拟合与最佳 epoch 变化）
  seed: 42

models:
  mlp:                 # MLP 结构
    hidden: 128         # r2: 64 -> 128（第一次结构变化）
    layers: 2
  cnn:                 # CNN 结构（一维卷积）
    kernel: 5           # r3: 3 -> 5（第二次结构变化）
    channels: 32
  lstm:                # LSTM 结构
    layers: 2           # r4: 1 -> 2（第三次结构变化）
    hidden: 64          # r4: 32 -> 64
